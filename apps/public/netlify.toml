# EncurtaLinks — site PÚBLICO (página inicial, página intermediária /s/:slug e APIs públicas).
#
# Configuração no Netlify (Project configuration > Build & deploy > Build settings):
#   Base directory:    (vazio = raiz do repositório)
#   Package directory: apps/public
# Todos os caminhos abaixo são relativos à raiz do repositório (base directory).
# Variáveis de ambiente: veja .env.example e docs/configuracao.md (definidas na UI do Netlify,
# por contexto; funções NÃO leem variáveis declaradas neste arquivo).

[build]
  command = "npm run build:public"
  publish = "dist/public"
  # Pula o build quando nada relevante mudou (cada deploy de produção consome créditos).
  # No primeiro build (sem cache) CACHED_COMMIT_REF = COMMIT_REF e o build sempre acontece.
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/public src db scripts package.json package-lock.json .nvmrc tsconfig.base.json tsconfig.json'

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "apps/public/netlify/functions"
  node_bundler = "esbuild"
  # Dependência opcional do "pg" que nunca é usada em tempo de execução.
  ignored_node_modules = ["pg-native"]

# Produção: aplica as migrações antes do build. Se a migração falhar, o deploy
# não é publicado e a versão anterior continua no ar.
[context.production]
  command = "npm run db:migrate && npm run build:public"

# Deploy previews e branch deploys: somente build, sem migração. Esses contextos
# não devem receber DATABASE_URL de produção (veja docs/deploy.md).
[context.deploy-preview]
  command = "npm run build:public"

[context.branch-deploy]
  command = "npm run build:public"

# ---------------------------------------------------------------------------
# Rotas. Funções com config.path (/api/links, /api/reports, /api/legal/:kind,
# /s/:slug, /s/:slug/continue, /consent) têm prioridade sobre estas regras.
# Não há fallback genérico da SPA: só as rotas listadas abaixo servem index.html.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/denunciar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacidade"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/preferencias"
  to = "/index.html"
  status = 200

# Rotas de API inexistentes respondem JSON 404 (nunca a SPA).
[[redirects]]
  from = "/api/*"
  to = "/api-404.json"
  status = 404

# Qualquer outro caminho: página 404 real, com status 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------------------
# Cabeçalhos dos arquivos estáticos. As funções definem os próprios cabeçalhos
# (o Netlify não aplica estas regras a respostas de funções).
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api-404.json"
  [headers.values]
    Cache-Control = "no-store"
